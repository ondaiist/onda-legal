<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Onda</title>
<style>
:root { --primary:#D66D80; --deep:#7E283C; --soft:#FFEBEE; --ink:#1E1A1B; --muted:#6E6567; --line:#E5DEDF; --low:#FCFBFB; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--ink); font:16px/1.65 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust:100%; }
header { background:var(--soft); border-bottom:1px solid var(--line); }
.bar { max-width:760px; margin:0 auto; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { font-weight:800; font-size:20px; color:var(--deep); text-decoration:none; letter-spacing:-0.01em; }
nav a { color:var(--deep); text-decoration:none; font-weight:600; font-size:14px; margin-left:16px; }
nav a.on { color:var(--primary); }
main { max-width:760px; margin:0 auto; padding:28px 20px 56px; }
h1 { font-size:30px; line-height:1.2; color:var(--deep); margin:8px 0 16px; letter-spacing:-0.02em; }
h2 { font-size:21px; color:var(--deep); margin:36px 0 10px; padding-top:18px; border-top:1px solid var(--line); }
h3 { font-size:17px; margin:24px 0 6px; }
a { color:var(--primary); }
code { background:var(--low); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:0.9em; }
table { width:100%; border-collapse:collapse; margin:14px 0; font-size:14px; display:block; overflow-x:auto; }
th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
th { background:var(--soft); color:var(--deep); }
blockquote { margin:12px 0; padding:8px 16px; border-left:4px solid var(--primary); background:var(--low); }
footer { border-top:1px solid var(--line); color:var(--muted); font-size:13px; text-align:center; padding:20px; }
.cards { display:grid; gap:14px; margin-top:20px; }
.card { display:block; padding:18px 20px; border:1px solid var(--line); border-radius:14px; text-decoration:none; color:var(--ink); background:var(--low); }
.card strong { color:var(--deep); font-size:18px; display:block; }
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="./">Onda</a><nav><a href="./onda/terms/">Terms</a><a href="./onda/privacy/">Privacy</a></nav></div></header>

</div></main>

</body>
</html>
